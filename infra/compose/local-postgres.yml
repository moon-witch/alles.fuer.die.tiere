services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: alles_fuer_die_tiere
      POSTGRES_USER: app_write
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_write -d alles_fuer_die_tiere"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
